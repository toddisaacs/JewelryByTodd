<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{pageTitle}}</title>
  <meta name="description" content="{{description}}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Petrona:ital,opsz,wght@0,9..72,500;0,9..72,600;1,9..72,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#catalog">{{skip}}</a>

  <div class="page">
    <header class="intro">
      <h1>{{name}}</h1>
      <p class="tagline">{{tagline}}</p>
      <p>{{intro}}</p>
      <nav class="style-index" aria-label="Settings">
        <ul>
{{navItems}}
        </ul>
      </nav>
    </header>

    <main id="catalog">
{{articles}}
    </main>

    <footer class="site-footer">
      <p>{{footer}}</p>
    </footer>
  </div>

  <!-- The build writes this page from the settings folders. -->
  <script src="catalog.min.js"></script>
</body>
</html>
